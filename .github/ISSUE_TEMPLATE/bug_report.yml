name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Your junction.yaml (remove tokens and secrets), the client you used, and the steps.
      render: yaml
  - type: input
    id: version
    attributes:
      label: Junction version
      description: Output of `junction version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output, or the server log from the dashboard's Servers tab. Check it for personal data before pasting.
      render: text
