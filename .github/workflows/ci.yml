name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [minimum, stable]   # the go.mod version and the latest release
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go == 'stable' && 'stable' || '' }}
          go-version-file: ${{ matrix.go == 'minimum' && 'go.mod' || '' }}
      - name: Check formatting
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # scan the toolchain releases are built with
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: go build -o junction ./cmd/junction
      - run: ./junction demo --no-open --no-traffic &
      - run: sleep 5
      - name: Official MCP conformance suite (protocol scenarios)
        run: |
          for s in server-initialize ping logging-set-level tools-list resources-list prompts-list completion-complete dns-rebinding-protection; do
            npx -y @modelcontextprotocol/conformance server --url http://127.0.0.1:7777/mcp --scenario "$s"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, vulncheck, conformance]
    runs-on: ubuntu-latest
    permissions:
      contents: write     # upload release assets
      id-token: write     # sign build provenance
      attestations: write # store build provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable   # ship binaries built with a patched standard library
      - name: Build binaries
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/junction-${os}-${arch}${ext}" ./cmd/junction
          done
          cd dist && sha256sum junction-* > checksums.txt && cat checksums.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/junction-*
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
